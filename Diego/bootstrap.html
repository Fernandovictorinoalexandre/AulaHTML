<!-- base -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="row">
      <div class="col-md-6">
        <h1>Olá, Bootstrap</h1>
        <p>Esta coluna ocupa metade da tela em md ou maior.</p>
        <button class="btn btn-primary">Clique aqui</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- grid -->
  <div class="container py-4">
  <div class="row">
    <div class="col-md-6 bg-light p-3">Coluna 1</div>
    <div class="col-md-6 bg-secondary text-white p-3">Coluna 2</div>
  </div>
</div>

<!-- utilitários -->
<div class="d-flex justify-content-between align-items-center p-3 bg-light">
  <span class="fw-bold">Título</span>
  <button class="btn btn-primary">Ação</button>
</div>

<!-- card -->
<div class="card" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title">Meu card</h5>
    <p class="card-text">Texto de exemplo dentro de um card Bootstrap.</p>
    <a href="#" class="btn btn-success">Saiba mais</a>
  </div>
</div>

<!-- formulários -->
<form>
  <div class="mb-3">
    <labelfor="email" class="form-label">E-mail</label>
    <input type="email" id="email" class="form-control" placeholder="nome@exemplo.com">
  </div>

  <div class="mb-3">
    <label for="senha" class="form-label">Senha</label>
    <input type="password" id="senha" class="form-control">
  </div>

  <button type="submit" class="btn btn-primary">Entrar</button>
</form>

<!-- Barra de navegação -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Meu Site</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        ><a class="nav-link" href="#">Início</a></li>
        ><a class="nav-link" href="#">Sobre</a></li>
        ><a class="nav-link" href="#">Contato</a></li>
      </ul>
    </div>
  </div>
</nav>

</body>
</html>
