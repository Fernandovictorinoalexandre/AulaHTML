<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício18</title>
</head>
<body>

    <img id="imagemA" src="https://images.steamusercontent.com/ugc/789751619479182513/9134F6CD5AF5421604A9CD2D21939230F6E2635A/?imw=512&&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" width="200" height="200">
    <img id="imagemB" src="https://i.pinimg.com/236x/73/70/d4/7370d460014a0eca888befda311bd80f.jpg" width="200" height="200">

        <script>
            let imgA = document.querySelector('#imagemA')
            let imgB = document.querySelector('#imagemB')
            imgA.addEventListener('click', function() {
                document.body.style.backgroundColor = 'blue'     
            })
            imgB.addEventListener('click', function() {
                document.body.style.backgroundColor = 'pink'
            })

        </script>

    
</body>
</html>
