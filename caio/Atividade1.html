<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>

    <script>
        let produto = Number(prompt("Informe um numero de 1 a 7:"))

        switch(produto){
            case 1:
                console.log('Alimento não perecivel')
                break;
            case 2:
                console.log('Alimento Perecivel')
                break;
            case 3:
                console.log('Vestuário')
                break;
            case 4:
                console.log('Higiene Pessoal')
                break;
            case 5:
                console.log('Limpeza e utensílios domésticos')
                break;
            case 6:
                console.log('Eletrónicos')
                break;
            case 7:
                console.log('Informática')
                break
        }

    </script>
    
</body>
</html>
