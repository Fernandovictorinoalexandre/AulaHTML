<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
    <link rel="stylesheet" href="Style-Biblioteca.css">
</head>

<body>
    
    <header class="topo_header">
        <h1 class=".principal h1">BIBLIOTECA</h1>
        <h2>Adiministrator</h2>
    </header>         
    <div id="tudo">        
        <form class="form-grid">
            <legend><strong><h2>Cadastro de Livros</h2></strong></legend>
            <br>
            <label>Título:<input name="nome" type="text" maxlength="40"required></label>
            <label>Autor:<input name="nome" type="text" maxlength="40"required> </label>
            <label>Categoria:<input name="nome" type="text" maxlength="40"required> </label>
            <label>Ano:<input name="date" type="date" required> </label>
            <label>ISBN:<input name="numero" type="numero" maxlength="13" required> </label>
            <label>Quantidade:<input name="numero" type="numero" maxlength="40" required> </label>
            <button class="btn-biblioteca">Cadastrar</button>
                                
            
        </form>
    </div>
        <footer class ="rodape">
            
            <small> Pagina Desenvolvida por Fernando Alexandre</small>
            
        </footer> <!--/.RODAPE-->
    
</body>
</html>
