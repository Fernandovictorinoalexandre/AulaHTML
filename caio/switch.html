<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>

    <script>
        let idade = 18;

        switch(idade){
            case 18:
                console.dir('Idade é 18')
                break;
            case 19:
                console.dir('Idade é 19')
                break;
            case 20:
                console.dir('Idade é 20')
                break;  
        }


    </script>
    
</body>
</html>
