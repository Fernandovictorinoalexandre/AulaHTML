<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If_elseif_else</title>
</head>
<body>

    <script>
        let idade = 18;
        let cidade = 'joinville';
        // Estrutura de if
        if(idade==18){
            console.dir('Idade é 18')
        }
        // estrutura de if e else
        if (idade == 20){
            console.dir('Idade é 20')
        }else{
            console.dir('Idade não é 20')
        }
        // estrutura de if com elseif e else
        if(idade==20){
            console.dir('Idade é 20')
        }else if (idade == 19) {
            console.dir('Idade é 19')
        }else if(idade == 18){
            console.dir('Idade é 18')
        }else{
            console.dir('Idade é alguma coisa')
        }
    </script>
    
</body>
</html>
